services:
  db:
    image: timescale/timescaledb:2.30.1-pg16-oss
    container_name: vulnrx-db
    environment:
      POSTGRES_USER: vulnrx
      POSTGRES_PASSWORD: vulnrx
      POSTGRES_DB: vulnrx
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5432:5432"
    volumes:
      - vulnrx-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnrx -d vulnrx"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  vulnrx-pgdata:
