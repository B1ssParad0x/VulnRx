<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {% include "top.html" %}
  <main>
    <section class="search-panel">
      <p class="kicker">01 search</p>
      <h1>Find a hospital</h1>
      <p class="lede">Names come from the Medicare hospital registry. A vendor appears only when a public file names that product.</p>
      <form action="/" method="get" role="search">
        <label class="sr" for="q">Hospital name or CCN</label>
        <input id="q" type="search" name="q" value="{{ query }}" placeholder="Hospital name or CCN" autocomplete="off" hx-get="/search" hx-trigger="keyup changed delay:200ms" hx-target="#results" hx-sync="this:replace">
      </form>
      <div id="results">
        {% include "results.html" %}
      </div>
    </section>
  </main>
  <footer><p>Every link and score on this page is a stored public record.</p></footer>
  <script src="/static/htmx.min.js"></script>
</body>
</html>
